version: 2

sources:
  - name: thelook
    description: >
      Google's public synthetic e-commerce dataset (bigquery-public-data.thelook_ecommerce).
      Synthetic data generated by Looker -- not real customer data.
    database: bigquery-public-data
    schema: thelook_ecommerce
    tables:
      - name: users
      - name: orders
      - name: order_items
      - name: products
      - name: events
